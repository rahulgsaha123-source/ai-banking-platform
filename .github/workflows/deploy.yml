name: Staggered CI/CD Pipeline to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Staggered Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 120m
          script: |
            echo "🚀 Pulling latest code..."
            cd ~/ai-banking-platform
            git pull origin main
            
            echo "🧹 Clearing Docker cache..."
            sudo docker builder prune -f
            
            echo "📦 Compiling Java microservices..."
            cd ~/ai-banking-platform/backend/service-registry && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/api-gateway && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/auth-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/customer-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/account-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/payment-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/transaction-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/notification-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/ai-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q
            cd ~/ai-banking-platform/backend/document-service && chmod +x mvnw && ./mvnw clean package -DskipTests -q

            echo "🐳 Starting Infrastructure Services..."
            cd ~/ai-banking-platform/infrastructure
            sudo docker compose up -d postgres kafka zookeeper prometheus grafana zipkin
            
            echo "🚀 Deploying Microservices sequentially..."
            
            for service in service-registry auth-service api-gateway payment-service notification-service transaction-service account-service customer-service document-service ai-service; do
              echo "--> Building & Deploying $service..."
              sudo docker compose build $service
              sudo docker compose up -d $service
              echo "--> Cooling down for 30s..."
              sleep 30
            done
            
            echo "🧹 Final Cleanup..."
            sudo docker image prune -f
            echo "✅ Deployment Complete!"