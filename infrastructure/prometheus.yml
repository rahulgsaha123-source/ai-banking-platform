global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'banking-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'auth-service:8081'
          - 'customer-service:8082'
          - 'account-service:8083'
          - 'payment-service:8084'
          - 'transaction-service:8085'
          - 'notification-service:8086'
